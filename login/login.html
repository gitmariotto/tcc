<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Ponte Solidária</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-split">
        <div class="login-banner">
            <div class="banner-overlay"></div>
        </div>

        <div class="login-form-container">

            <a href="../index.html" class="back-link">
                Voltar para o início
            </a>

            <div class="form-wrapper">
                <h1 class="login-title">Entrar</h1>
                <p class="login-subtitle">Bem-vindo de volta.</p>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" id="password" class="form-input" placeholder="Sua senha" required>
                    </div>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>

                <div class="form-footer">
                    <a href="../cadastro/cadastro.html" class="signup-link">Não tenho conta, quero me cadastrar</a>
                </div>
            </div>

        </div>
    </main>

    <script src="login.js"></script>
</body>

</html>
