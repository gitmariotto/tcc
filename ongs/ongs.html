<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponte Solidária - Instituições Cadastradas</title>

    <!-- 1º O CSS Global com os estilos do cabeçalho -->
    <link rel="stylesheet" href="../global.css">
    <!-- 2º O CSS específico da página de ONGs -->
    <link rel="stylesheet" href="ongs.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="logo-link">
                <img src="../imagens/logo.png" alt="Logo Ponte Solidária" class="logo-img">
            </a>

            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="ongs.html" class="nav-link">ONGs</a></li>
                    <li><a href="../campanhas/campanhas.html" class="nav-link">Campanhas</a></li>
                    <li><a href="../carona.solidaria/carona.html" class="nav-link">Carona solidária</a></li>
                    <li><a href="../voluntariado/voluntariado.html" class="nav-link">Voluntariado</a></li>
                    <li><a href="../saiba.mais.pdf" target="_blank" class="nav-link">Saiba mais</a></li>
                </ul>
            </nav>

            <div class="user-actions">
                <a href="../login/login.html" class="nav-link user-panel">Entrar</a>
                <a href="../cadastro/cadastro.html" class="btn-create-action" id="createActionBtn">Criar ação</a>
            </div>
        </div>
    </header>

    <main class="page-container">

        <section class="page-header">
            <div class="header-content">
                <h1 class="page-title">Instituições cadastradas</h1>
                <p class="page-subtitle">
                    Conheça as instituições, veja o que elas precisam e envie sua doação com transporte solidário.
                </p>
            </div>
            <a href="../cadastro/cadastro.html" class="btn-primary-action">Cadastrar minha ONG</a>
        </section>

        <section class="search-filters-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por nome ou cidade" class="search-input">
            </div>

            <div class="filter-chips" id="filterChips">
                <button class="chip active" data-causa="Todas">Todas</button>
                <button class="chip" data-causa="Animais">Animais</button>
                <button class="chip" data-causa="Crianças">Crianças</button>
                <button class="chip" data-causa="Idosos">Idosos</button>
                <button class="chip" data-causa="Saúde">Saúde</button>
                <button class="chip" data-causa="Educação">Educação</button>
                <button class="chip" data-causa="Meio ambiente">Meio ambiente</button>
                <button class="chip" data-causa="Alimentação">Alimentação</button>
                <button class="chip" data-causa="Moradia">Moradia</button>
                <button class="chip" data-causa="Cultura">Cultura</button>
                <button class="chip" data-causa="Emergência">Emergência</button>
            </div>
        </section>

        <section class="ongs-grid" id="ongsGrid">
        </section>

    </main>

    <script src="ongs.js"></script>
</body>

</html>
