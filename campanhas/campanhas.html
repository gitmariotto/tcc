    <!-- 1º O CSS Global com os estilos do cabeçalho e logo -->
    <link rel="stylesheet" href="../global.css">
    <!-- 2º O CSS específico da página de Campanhas -->

</head>

<body>

    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="logo-link">
                <img src="../imagens/logo.png" alt="Logo Ponte Solidária" class="logo-img">
            </a>

            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="../ongs/ongs.html" class="nav-link">ONGs</a></li>

                    <li><a href="../saiba.mais.pdf" target="_blank" class="nav-link">Saiba mais</a></li>
                </ul>
            </nav>

            <div class="user-actions">
                <a href="../login/login.html" class="nav-link user-panel">Entrar</a>
                <a href="../cadastro/cadastro.html" class="btn-create-action" id="createActionBtn">Criar ação</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <h1 class="page-title">O que as ONGs precisam agora</h1>
            <p class="page-subtitle">
                Cada campanha mostra os itens necessários e o prazo. Escolha uma e cadastre sua doação — o transporte a
                gente resolve junto.
            </p>
        </section>

        <section class="filters-section">
            <div class="chips-wrapper" id="chipsWrapper">
                <button class="chip active" data-causa="Todas">Todas as causas</button>
                <button class="chip" data-causa="Animais">Animais</button>
                <button class="chip" data-causa="Crianças">Crianças</button>
                <button class="chip" data-causa="Idosos">Idosos</button>
                <button class="chip" data-causa="Saúde">Saúde</button>
                <button class="chip" data-causa="Educação">Educação</button>
                <button class="chip" data-causa="Meio ambiente">Meio ambiente</button>
                <button class="chip" data-causa="Alimentação">Alimentação</button>
                <button class="chip" data-causa="Moradia">Moradia</button>
                <button class="chip" data-causa="Cultura">Cultura</button>
                <button class="chip" data-causa="Emergência">Emergência</button>
            </div>
        </section>

        <section class="campanhas-grid" id="campanhasGrid">
        </section>

    <script src="campanhas.js"></script>
